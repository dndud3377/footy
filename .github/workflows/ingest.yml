name: ingest

# 매일 08:15 KST (23:15 UTC) — 유럽 밤 경기가 모두 끝나고 데이터가 갱신된 뒤
on:
  schedule:
    - cron: "15 23 * * *"
  workflow_dispatch:
    inputs:
      full:
        description: "지난 시즌까지 전부 다시 수집"
        type: boolean
        default: false

permissions:
  contents: write

# data/ 에 쓰는 워크플로끼리 동시에 돌지 않게
concurrency:
  group: data-writer
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: pip install -e .

      - name: Ingest
        env:
          FOOTBALL_DATA_TOKEN: ${{ secrets.FOOTBALL_DATA_TOKEN }}
        run: python -m footy ingest ${{ inputs.full && '--full' || '' }}

      - name: Commit data
        if: always()
        run: |
          git config user.name "footy-bot"
          git config user.email "footy-bot@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "변경 없음"
          else
            git commit -m "data: ingest $(TZ=Asia/Seoul date +'%Y-%m-%d %H:%M KST')"
            git pull --rebase origin main
            git push
          fi

      - name: Report
        if: always()
        run: cat data/ingest_report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Strict check
        run: python -m footy check --strict
